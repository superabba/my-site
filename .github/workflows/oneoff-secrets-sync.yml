# 일회성 발행기(superabba/oneoff-publisher)에 게시 계정 시크릿을 복사한다.
# 카드뉴스봇 실행·DB와는 무관 (읽기만 하고, 이 저장소에는 아무것도 쓰지 않음).
# 인스타·스레드 토큰은 '카드뉴스 토큰 갱신'(매달 1일 09:20)이 새로 바꾸므로, 그 뒤에 다시 복사한다.
# 필요: CARDBOT_ADMIN_TOKEN이 oneoff-publisher 저장소의 "Secrets: Read and write" 권한도 가져야 한다.
name: 일회성 발행기 시크릿 동기화

on:
  schedule:
    - cron: "50 0 1 * *" # 매달 1일 KST 09:50 (토큰 갱신 30분 뒤)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.CARDBOT_ADMIN_TOKEN }}
      TARGET: superabba/oneoff-publisher
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
    steps:
      - name: 시크릿 복사
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::CARDBOT_ADMIN_TOKEN이 없어 건너뜁니다"; exit 0; fi
          ok=0; fail=0
          for name in IG_USER_ID IG_ACCESS_TOKEN THREADS_USER_ID THREADS_ACCESS_TOKEN \
                      YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN \
                      YOUTUBE_CHANNEL_ID YOUTUBE_PRIVACY; do
            value="${!name}"
            [ -n "$value" ] || { echo "$name 값 없음, 건너뜀"; continue; }
            if printf '%s' "$value" | gh secret set "$name" --repo "$TARGET" 2>err.txt; then
              echo "$name 복사 완료"; ok=$((ok+1))
            else
              echo "$name 실패: $(head -c 200 err.txt)"; fail=$((fail+1))
            fi
          done
          if [ "$ok" -eq 0 ] && [ "$fail" -gt 0 ]; then
            echo "::warning::$TARGET에 시크릿을 쓰지 못했습니다. CARDBOT_ADMIN_TOKEN(PAT)의 저장소 목록에 oneoff-publisher를 추가하고 Secrets 읽기·쓰기 권한을 주세요."
            exit 0
          fi
          [ "$fail" -eq 0 ] || exit 1
